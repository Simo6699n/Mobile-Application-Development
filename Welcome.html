<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GearUp | Welcome</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone">
    <header>GearUp</header>
    <main>
      <section class="screen active" id="auth">
        <div class="card">
          <h3>Welcome to GearUp</h3>
          <p>Sign up or log in to start your ride tracking journey.</p>

          <input type="email" id="email" placeholder="Email" class="input" />
          <input type="password" id="password" placeholder="Password" class="input" />

          <button class="btn" id="signupBtn">Sign Up</button>
          <button class="btn ghost" id="loginBtn">Log In</button>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="auth.js"></script>
</body>
</html>
